<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OpenChamber cube: levitation</title>
<!--
  Logo animation "Levitation". Geometry matches packages/web/public/logo-dark-512x512.svg:
  isometric cube, three nested tier plates on the top face (scales 0.8, 0.58, 0.36).
  The plates lift off in turn, the cube makes one full turn while the plates spin at their
  own rates, then the plates settle back and flash. Every loop starts and ends in the exact
  logo pose. Colour follows the page text colour.
-->
<style>
html{background:#0f0f10;color:#f5f5f7;font-family:system-ui,sans-serif}
@media (prefers-color-scheme: light){html{background:#fafafa;color:#151515}}
body{margin:0;padding:24px;display:flex;flex-direction:column;gap:12px}
canvas{width:100%;height:420px;display:block}
.bar{display:flex;gap:6px}
.bar button{font:inherit;color:inherit;background:transparent;border:1px solid currentColor;border-radius:6px;padding:4px 10px;opacity:.5;cursor:pointer}
.bar button[aria-pressed="true"]{opacity:1}
</style>
</head>
<body>
<div class="bar" id="speed">
<button aria-pressed="true" data-k="1">1×</button>
<button aria-pressed="false" data-k="0.5">0.5×</button>
<button aria-pressed="false" data-k="0.25">0.25×</button>
</div>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,dpr=1;
function resize(){dpr=window.devicePixelRatio||1;const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
new ResizeObserver(resize).observe(cv);resize();
let fg=[245,245,247];
function readFg(){const c=document.createElement('canvas');c.width=c.height=1;const x=c.getContext('2d');x.fillStyle='#f5f5f7';x.fillStyle=getComputedStyle(document.body).color;x.fillRect(0,0,1,1);const d=x.getImageData(0,0,1,1).data;fg=[d[0],d[1],d[2]];}
const rgba=a=>`rgba(${fg[0]},${fg[1]},${fg[2]},${Math.max(0,Math.min(1,a))})`;
const {sin,cos,PI,max,min,sqrt,atan}=Math;
const clamp=x=>x<0?0:x>1?1:x;
const seg=(s,a,b)=>clamp((s-a)/(b-a));
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eout=x=>1-Math.pow(1-x,3);
const sstep=x=>x*x*(3-2*x);
const mm=(A,B)=>{const R=new Array(9);for(let i=0;i<3;i++)for(let j=0;j<3;j++)R[i*3+j]=A[i*3]*B[j]+A[i*3+1]*B[3+j]+A[i*3+2]*B[6+j];return R;};
const mv=(M,v)=>[M[0]*v[0]+M[1]*v[1]+M[2]*v[2],M[3]*v[0]+M[4]*v[1]+M[5]*v[2],M[6]*v[0]+M[7]*v[1]+M[8]*v[2]];
const RX=a=>[1,0,0,0,cos(a),-sin(a),0,sin(a),cos(a)];
const RY=a=>[cos(a),0,sin(a),0,1,0,-sin(a),0,cos(a)];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sc=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
// Isometric view: yaw 45°, pitch atan(1/sqrt 2). Matches the logo's 2D coordinates exactly.
const V=mm(RX(atan(1/sqrt(2))),RY(PI/4));
const L=(()=>{const l=[.35,-.6,.5],n=sqrt(dot(l,l));return sc(l,1/n);})();
const FACES=[
 {n:[0,1,0],u:[1,0,0],v:[0,0,1]},
 {n:[-1,0,0],u:[0,1,0],v:[0,0,1]},
 {n:[0,0,1],u:[1,0,0],v:[0,1,0]},
 {n:[1,0,0],u:[0,1,0],v:[0,0,1]},
 {n:[0,0,-1],u:[1,0,0],v:[0,1,0]},
 {n:[0,-1,0],u:[1,0,0],v:[0,0,1]}];
const quad=(c,u,v)=>[add(add(c,u),v),add(add(c,u),sc(v,-1)),add(add(c,sc(u,-1)),sc(v,-1)),add(add(c,sc(u,-1)),v)];
const BASE=[.22,.27,.85],LIT=[.55,.55,1],SCALE=[.8,.58,.36];
const REST_G=sqrt(2/3);
function path(pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();}
function render(st){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 const S=min(H*.17,W*.19),cx=W/2,cy=H*.6,lw=S*.075;
 const R=mm(mm(st.P,V),st.M);
 const proj=p=>{const q=mv(R,p);return[cx+S*q[0],cy-S*q[1],q[2]];};
 ctx.lineJoin='round';ctx.lineCap='round';
 for(const F of FACES){const nv=mv(R,F.n);if(nv[2]<=1e-3)continue;
  const pts=quad(F.n,F.u,F.v).map(proj);
  const base=.06+.11*max(0,dot(nv,L));
  // Depth gradient along the face plane, so the shading turns smoothly with the cube.
  const g=[-nv[2]*nv[0],-nv[2]*nv[1],1-nv[2]*nv[2]];
  const gl=sqrt(g[0]*g[0]+g[1]*g[1]);
  const m=clamp(gl/REST_G);
  const c=proj(F.n);
  path(pts);
  if(gl>1e-4){const dx=g[0]/gl,dy=-g[1]/gl,ext=S*1.3;
   const gr=ctx.createLinearGradient(c[0]-dx*ext,c[1]-dy*ext,c[0]+dx*ext,c[1]+dy*ext);
   gr.addColorStop(0,rgba(base*(1-.65*m)));gr.addColorStop(1,rgba(base*(1+.5*m)));ctx.fillStyle=gr;}
  else ctx.fillStyle=rgba(base);
  ctx.fill();ctx.strokeStyle=rgba(1);ctx.lineWidth=lw;ctx.stroke();}
 const F=FACES[0];
 if(mv(R,F.n)[2]>1e-3){
  const ps=st.plates.map((p,i)=>Object.assign({i},p)).sort((a,b)=>a.h-b.h);
  for(const p of ps){
   const cs=cos(p.r),sn=sin(p.r),k=SCALE[p.i];
   const u=sc(add(sc(F.u,cs),sc(F.v,sn)),k),v=sc(add(sc(F.u,-sn),sc(F.v,cs)),k);
   const pts=quad(sc(F.n,1+p.h),u,v).map(proj);
   path(pts);ctx.fillStyle=rgba(p.fill);ctx.fill();
   if(p.edge>.01){ctx.strokeStyle=rgba(.5*p.edge);ctx.lineWidth=lw*.45;ctx.stroke();}}}
}
function levitate(s){
 const spin=eio(seg(s,.2,.74));
 const plates=[];
 for(let i=0;i<3;i++){
  const lift=eout(seg(s,.08+.04*i,.26+.04*i));
  const fs=.68+.045*i,fe=fs+.16,fall=seg(s,fs,fe);
  const Hh=.42+.42*i;
  const float=lift*(1-sstep(fall));
  const bob=.06*sin(2*PI*s*4+i*1.7)*float;
  const h=Hh*lift*(1-eio(fall))+bob;
  const r=eio(seg(s,.24,.72))*[-PI,2*PI,-3*PI][i];
  const land=s>=fe-.03?sin(PI*seg(s,fe-.03,fe+.09)):0;
  const charge=sin(PI*seg(s,.025*(2-i),.06+.025*(2-i)));
  plates.push({h,r,fill:BASE[i]+(LIT[i]-BASE[i])*max(land,charge,float*.4),edge:float});}
 return{M:RY(spin*2*PI),P:RX(.32*sin(PI*spin)),plates};
}
const DUR=9000;let k=1,phase=0,last=performance.now(),n=0;
document.querySelectorAll('#speed button').forEach(b=>b.addEventListener('click',()=>{k=+b.dataset.k;document.querySelectorAll('#speed button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));}));
function frame(now){if(n++%60===0)readFg();phase=(phase+(now-last)*k/DUR)%1;last=now;render(levitate(phase));requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</body>
</html>
