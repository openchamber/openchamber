<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OpenChamber cube: tumble</title>
<!--
  Logo animation "Tumble". Geometry matches packages/web/public/logo-dark-512x512.svg:
  isometric cube, three nested tier plates on the top face (scales 0.8, 0.58, 0.36).
  The cube tips over three times by 90 degrees (top face goes left, then right, then back up)
  along one squad spline through those poses, so it never stops between tips. The plates ride
  on their face without moving and flash when the cube settles back into the logo pose.
  Every loop starts and ends in the exact logo pose. Colour follows the page text colour.
-->
<style>
html{background:#0f0f10;color:#f5f5f7;font-family:system-ui,sans-serif}
@media (prefers-color-scheme: light){html{background:#fafafa;color:#151515}}
body{margin:0;padding:24px;display:flex;flex-direction:column;gap:12px}
canvas{width:100%;height:420px;display:block}
.bar{display:flex;gap:6px}
.bar button{font:inherit;color:inherit;background:transparent;border:1px solid currentColor;border-radius:6px;padding:4px 10px;opacity:.5;cursor:pointer}
.bar button[aria-pressed="true"]{opacity:1}
</style>
</head>
<body>
<div class="bar" id="speed">
<button aria-pressed="true" data-k="1">1×</button>
<button aria-pressed="false" data-k="0.5">0.5×</button>
<button aria-pressed="false" data-k="0.25">0.25×</button>
</div>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,dpr=1;
function resize(){dpr=window.devicePixelRatio||1;const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
new ResizeObserver(resize).observe(cv);resize();
let fg=[245,245,247];
function readFg(){const c=document.createElement('canvas');c.width=c.height=1;const x=c.getContext('2d');x.fillStyle='#f5f5f7';x.fillStyle=getComputedStyle(document.body).color;x.fillRect(0,0,1,1);const d=x.getImageData(0,0,1,1).data;fg=[d[0],d[1],d[2]];}
const rgba=a=>`rgba(${fg[0]},${fg[1]},${fg[2]},${Math.max(0,Math.min(1,a))})`;
const {sin,cos,PI,max,min,sqrt,atan}=Math;
const clamp=x=>x<0?0:x>1?1:x;
const seg=(s,a,b)=>clamp((s-a)/(b-a));
const esine=x=>(1-cos(PI*x))/2;
const mm=(A,B)=>{const R=new Array(9);for(let i=0;i<3;i++)for(let j=0;j<3;j++)R[i*3+j]=A[i*3]*B[j]+A[i*3+1]*B[3+j]+A[i*3+2]*B[6+j];return R;};
const mv=(M,v)=>[M[0]*v[0]+M[1]*v[1]+M[2]*v[2],M[3]*v[0]+M[4]*v[1]+M[5]*v[2],M[6]*v[0]+M[7]*v[1]+M[8]*v[2]];
const RX=a=>[1,0,0,0,cos(a),-sin(a),0,sin(a),cos(a)];
const RY=a=>[cos(a),0,sin(a),0,1,0,-sin(a),0,cos(a)];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sc=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
// Quaternions as [w, x, y, z].
const qn=q=>{const l=Math.hypot(q[0],q[1],q[2],q[3]);return q.map(x=>x/l);};
const qa=(ax,a)=>[cos(a/2),ax[0]*sin(a/2),ax[1]*sin(a/2),ax[2]*sin(a/2)];
const qmul=(a,b)=>[a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3],a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1],a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]];
const qinv=q=>[q[0],-q[1],-q[2],-q[3]];
const qdot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3];
function qlog(q){const v=Math.hypot(q[1],q[2],q[3]);if(v<1e-9)return[0,0,0,0];const t=Math.atan2(v,q[0])/v;return[0,q[1]*t,q[2]*t,q[3]*t];}
function qexp(p){const t=Math.hypot(p[1],p[2],p[3]);if(t<1e-9)return[1,0,0,0];const s=sin(t)/t;return[cos(t),p[1]*s,p[2]*s,p[3]*s];}
function slerp(a,b,h){let d=qdot(a,b);if(d<0){b=b.map(x=>-x);d=-d;}if(d>.9995)return qn(a.map((x,i)=>x+(b[i]-x)*h));const th=Math.acos(d),s=sin(th),wa=sin((1-h)*th)/s,wb=sin(h*th)/s;return a.map((x,i)=>x*wa+b[i]*wb);}
const qmat=([w,x,y,z])=>[1-2*(y*y+z*z),2*(x*y-w*z),2*(x*z+w*y),2*(x*y+w*z),1-2*(x*x+z*z),2*(y*z-w*x),2*(x*z-w*y),2*(y*z+w*x),1-2*(x*x+y*y)];
// Key poses: top face -> left -> right -> top. The last pose is a cube symmetry that keeps the
// top face on top, so it looks exactly like the first one.
const K=[[1,0,0,0]];
K.push(qmul(qa([0,0,1],PI/2),K[0]));
K.push(qmul(qa([0,1,0],PI/2),K[1]));
K.push(qmul(qa([1,0,0],-PI/2),K[2]));
for(let i=1;i<K.length;i++)if(qdot(K[i-1],K[i])<0)K[i]=K[i].map(x=>-x);
// Squad control points: velocity stays continuous through the intermediate poses.
const SQ=K.map((q,i)=>{if(i===0||i===K.length-1)return q;const qi=qinv(q),a=qlog(qmul(qi,K[i+1])),b=qlog(qmul(qi,K[i-1]));return qmul(q,qexp([0,-(a[1]+b[1])/4,-(a[2]+b[2])/4,-(a[3]+b[3])/4]));});
function orient(u){const n=K.length-1,x=clamp(u)*n,i=min(n-1,Math.floor(x)),h=x-i;return qmat(slerp(slerp(K[i],K[i+1],h),slerp(SQ[i],SQ[i+1],h),2*h*(1-h)));}
// Isometric view: yaw 45°, pitch atan(1/sqrt 2). Matches the logo's 2D coordinates exactly.
const V=mm(RX(atan(1/sqrt(2))),RY(PI/4));
const L=(()=>{const l=[.35,-.6,.5],n=sqrt(dot(l,l));return sc(l,1/n);})();
const FACES=[
 {n:[0,1,0],u:[1,0,0],v:[0,0,1]},
 {n:[-1,0,0],u:[0,1,0],v:[0,0,1]},
 {n:[0,0,1],u:[1,0,0],v:[0,1,0]},
 {n:[1,0,0],u:[0,1,0],v:[0,0,1]},
 {n:[0,0,-1],u:[1,0,0],v:[0,1,0]},
 {n:[0,-1,0],u:[1,0,0],v:[0,0,1]}];
const quad=(c,u,v)=>[add(add(c,u),v),add(add(c,u),sc(v,-1)),add(add(c,sc(u,-1)),sc(v,-1)),add(add(c,sc(u,-1)),v)];
const BASE=[.22,.27,.85],LIT=[.55,.55,1],SCALE=[.8,.58,.36];
const REST_G=sqrt(2/3);
function path(pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();}
function render(M,fills){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 const S=min(H*.19,W*.19),cx=W/2,cy=H*.52,lw=S*.075;
 const R=mm(V,M);
 const proj=p=>{const q=mv(R,p);return[cx+S*q[0],cy-S*q[1],q[2]];};
 ctx.lineJoin='round';ctx.lineCap='round';
 for(const F of FACES){const nv=mv(R,F.n);if(nv[2]<=1e-3)continue;
  const pts=quad(F.n,F.u,F.v).map(proj);
  const base=.06+.11*max(0,dot(nv,L));
  // Depth gradient along the face plane, so the shading turns smoothly with the cube.
  const g=[-nv[2]*nv[0],-nv[2]*nv[1],1-nv[2]*nv[2]];
  const gl=sqrt(g[0]*g[0]+g[1]*g[1]),m=clamp(gl/REST_G),c=proj(F.n);
  path(pts);
  if(gl>1e-4){const dx=g[0]/gl,dy=-g[1]/gl,ext=S*1.3;
   const gr=ctx.createLinearGradient(c[0]-dx*ext,c[1]-dy*ext,c[0]+dx*ext,c[1]+dy*ext);
   gr.addColorStop(0,rgba(base*(1-.65*m)));gr.addColorStop(1,rgba(base*(1+.5*m)));ctx.fillStyle=gr;}
  else ctx.fillStyle=rgba(base);
  ctx.fill();ctx.strokeStyle=rgba(1);ctx.lineWidth=lw;ctx.stroke();}
 // Plates fade out as their face turns edge-on, so they never pop.
 const F=FACES[0],ha=clamp(mv(R,F.n)[2]*6);
 if(ha>0)for(let i=0;i<3;i++){
  path(quad(F.n,sc(F.u,SCALE[i]),sc(F.v,SCALE[i])).map(proj));
  ctx.fillStyle=rgba(fills[i]*ha);ctx.fill();}
}
function tumble(s){
 const u=esine(seg(s,.05,.82));
 const fills=[0,1,2].map(i=>{
  const land=sin(PI*seg(s,.8+.03*i,.92+.03*i));
  return BASE[i]+(LIT[i]-BASE[i])*land;});
 return[orient(u),fills];
}
const DUR=4800;let k=1,phase=0,last=performance.now(),n=0;
document.querySelectorAll('#speed button').forEach(b=>b.addEventListener('click',()=>{k=+b.dataset.k;document.querySelectorAll('#speed button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));}));
function frame(now){if(n++%60===0)readFg();phase=(phase+(now-last)*k/DUR)%1;last=now;const[M,f]=tumble(phase);render(M,f);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</body>
</html>
