name: Overlay scrollbar interaction recording

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: true

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web bundle
        run: bun run --cwd packages/web build

      - name: Install Playwright chromium
        working-directory: scripts
        run: |
          npm init -y >/dev/null
          npm install playwright@1.48.0 --no-audit --no-fund --silent
          npx playwright install chromium

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Start server (auth disabled) and record interaction
        env:
          OPENCHAMBER_DATA_DIR: /tmp/oc-recording-data
          OPENCHAMBER_DISABLE_TUNNELS: '1'
          OPENCHAMBER_RELAY_HOST: off
        run: |
          set -e
          mkdir -p "$OPENCHAMBER_DATA_DIR"
          (bun packages/web/server/index.js --port 3001 --data-dir "$OPENCHAMBER_DATA_DIR" \
            >/tmp/oc-server.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/auth/session >/tmp/session.json 2>/dev/null; then
              echo "Server up after ${i}s: $(cat /tmp/session.json)"
              break
            fi
            sleep 1
          done
          grep -q '"authenticated":true' /tmp/session.json || {
            echo "Auth gate not disabled — /auth/session: $(cat /tmp/session.json)"
            echo "--- server log tail ---"
            tail -30 /tmp/oc-server.log
            exit 1
          }
          BASE_URL=http://127.0.0.1:3001 \
          OUT_DIR=./screenshots \
          node scripts/record-overlay-scrollbar.mjs

      - name: Upload recording artifact
        uses: actions/upload-artifact@v4
        with:
          name: overlay-scrollbar-recording
          path: |
            screenshots/overlay-scrollbar-hover.gif
            screenshots/overlay-scrollbar-hover.webm
          if-no-files-found: error
