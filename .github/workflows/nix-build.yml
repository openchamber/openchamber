# Builds the flake's server package on every platform it targets, and
# verifies that the committed dependency hashes are current: a PR changing
# bun.lock or the opencode pin runs the bake in check mode on all three
# runners, and a stale hash fails the check with a ready-to-apply diff in
# the job summary. The check is what makes dependency bumps carry their own
# hashes; there is no post-merge bake. Standard hosted runners are free for
# this public repo; no cache daemon, no secrets, so the proof needs nothing
# but the lockfile.
name: nix-build

on:
  pull_request:
    paths:
      - bun.lock
      - packages/electron/package.json
      - flake.lock
      - flake.nix
      - nix/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify this platform's dependency hashes are current
        uses: ./.github/actions/nix-bake
        with:
          mode: check
          system: ${{ matrix.system }}

      - name: Build the server with the verified dependency cache
        run: nix build --no-link .#openchamber -L
