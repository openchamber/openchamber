name: Search button screenshots

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web bundle
        run: bun run --cwd packages/web build

      - name: Install Playwright chromium
        working-directory: scripts
        run: |
          npm init -y >/dev/null
          npm install playwright@1.48.0 --no-audit --no-fund --silent

      - name: Start server (auth disabled) and capture screenshots
        env:
          OPENCHAMBER_DATA_DIR: /tmp/oc-screenshots-data
          OPENCHAMBER_DISABLE_TUNNELS: '1'
          OPENCHAMBER_RELAY_HOST: off
        run: |
          set -e
          mkdir -p "$OPENCHAMBER_DATA_DIR"
          (bun packages/web/server/index.js --port 3001 --data-dir "$OPENCHAMBER_DATA_DIR" \
            >/tmp/oc-server.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/auth/session >/tmp/session.json 2>/dev/null; then
              echo "Server up after ${i}s: $(cat /tmp/session.json)"
              break
            fi
            sleep 1
          done
          grep -q '"authenticated":true' /tmp/session.json || {
            echo "Auth gate not disabled — /auth/session: $(cat /tmp/session.json)"
            echo "--- server log tail ---"
            tail -30 /tmp/oc-server.log
            exit 1
          }
          BASE_URL=http://127.0.0.1:3001 \
          OUT_DIR=./screenshots \
          node scripts/capture-search-button-screenshots.mjs

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: search-button-screenshots
          path: screenshots/search-button-*.png
          if-no-files-found: error
