name: Mobile Smoke Build

on:
  workflow_dispatch:

concurrency:
  group: mobile-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Android emulator smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: oven-sh/setup-bun@735343b667d3e8f658f44d0c5f7c67f7b8a4f3c5
        with:
          bun-version: 1.3.14

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check mobile package
        run: bun run type-check:mobile

      - name: Lint mobile package
        run: bun run lint:mobile

      - name: Secure Workspace client fixture
        run: bun run --cwd packages/mobile smoke:fixture

      - name: Physical-device helper tests
        run: bun run --cwd packages/mobile test:physical-smoke

      - name: Build Android debug APK
        run: bun run mobile:build:android:debug

      - name: Android Emulator install and launch smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          script: bun run --cwd packages/mobile smoke:android

      - name: Upload Android debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openchamber-android-debug-apk
          path: packages/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios-simulator:
    name: iOS simulator app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build iOS simulator app
        run: bun run mobile:build:ios:simulator

      - name: iOS Simulator install and launch smoke
        run: bun run --cwd packages/mobile smoke:ios
