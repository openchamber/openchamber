# Evaluates and builds server and desktop packages on each supported system.
# Evaluation uses import-from-derivation to generate the Bun dependency cache,
# so even nix eval and nix flake check --no-build may build the converter.
name: nix-eval

on:
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - bun.lock
      - package.json
      - packages/**/package.json
      - bun-patches/**
      - .github/workflows/nix-eval.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    name: nix (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            allow-import-from-derivation = true

      - name: Evaluate the flake's outputs
        run: |
          nix eval --raw .#openchamber.drvPath
          nix eval --raw .#openchamber-desktop.drvPath
          nix eval --raw .#opencode-cli.drvPath
          nix eval --raw .#openchamber.bunDeps.drvPath
          nix eval --raw .#opencode-cli.node_modules.drvPath
          nix flake check --no-build

      - name: Build server and desktop
        run: nix build --no-link -L .#openchamber .#openchamber-desktop
