name: pr checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Nothing runs these checks on a push to main, so a branch about to be merged
  # there is checked by hand first: gh workflow run "pr checks" --ref <branch>
  workflow_dispatch:

# A new push to the same PR makes the older run pointless.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Six independent jobs on their own Blacksmith runners (same image as
# ubuntu-24.04, faster CPUs, colocated cache; the Blacksmith GitHub App is
# installed on the openchamber org). None of them reads another's output: the
# tests and type-check need only what `bun install` prepares (postinstall
# builds the SDK and the built-in extensions), so the wall time is the slowest
# job, not the sum.
jobs:
  type-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run type-check

  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Validate docs source
        run: bun run docs:validate
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Changelog outputs match their sources
        run: bun run changelog:check

  # The part of `bun run check:changed` the other jobs do not run: dead code,
  # the ratchet over the files the pull request touches, and the file size
  # limit. A pull request is checked out as its merge commit, whose first parent
  # is the base; a run started by hand compares the branch with origin/main.
  changed-gate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Dead code
        run: bun run dead-code
      - name: Ratchet and file size
        run: node scripts/check-changed.mjs --base ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'origin/main' }} --ratchet-only

  # The scenarios of the behavior net that the pull request's files can break
  # (scripts/verify/DOCUMENTATION.md), in four parts so a wide change still
  # finishes in minutes. A change that selects nothing starts no stand. Not a
  # required check: a scenario that fails and then passes is reported as flaky.
  behavior-net:
    name: behavior-net (${{ matrix.part }}/4)
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      # A pull request is checked out as its merge commit, whose first parent
      # is the base. A run started by hand plays the whole net: on main, or a
      # branch equal to it, a comparison would select nothing and pass.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Play the scenarios
        run: bun run verify -- ${{ github.event_name == 'pull_request' && '--changed --base HEAD^1' || '' }} --retry-failed --shard ${{ matrix.part }}/4
      - name: Keep the failures, also of a scenario that passed when played again
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: behavior-net-${{ matrix.part }}
          if-no-files-found: ignore
          path: |
            tmp/verify/**/summary.json
            tmp/verify/**/failure.png
            tmp/verify/**/logs/**
          retention-days: 7

  tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test
      - name: Electron Linux packaging unit tests
        working-directory: packages/electron
        run: |
          bun run test:architecture
          bun run test:updater

  # Catches what type-check cannot: bundling, Vite-only syntax, the web
  # build's memory ceiling. The packages whose `build` is only a type-check (`tsc -b`)
  # (ui) or a no-op (electron) are covered by the type-check job.
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build web
        run: bun run --cwd packages/web build
      - name: Build VS Code extension
        run: bun run --cwd packages/vscode build
      - name: Prepare mobile web assets
        run: bun run --cwd packages/mobile build:assets
