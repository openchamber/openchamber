name: pr checks

# CI policy: .github/ci-policy.md (fleet design developing-today/code#1779
# sec.3.3/sec.3.4; Phase 2, developing-today/code#1781). This workflow is
# openchamber's designated main-gate for the Phase 3 remediation chain.
# Main-gate triggers (Drew 2026-11-04): the nightly schedule below
# and workflow_dispatch only. There is no push or pull_request
# trigger and no PR tier: this workflow does not run on pull_request,
# so nothing here gates a merge. All five jobs (lint, type-check,
# tests, build, flake-eval) run on every trigger. Merged code is verified by the
# next nightly run, or sooner by a manual dispatch on the exact SHA.
# The workflow name stays
# "pr checks" because the Phase 3 watcher (main-broken.yml) references
# it by that name.
on:
  # The nightly run is the automatic verification for merged code:
  # without it, a merge that breaks main would only be discovered by
  # a manual dispatch.
  schedule:
    # Nightly backstop for the main tier: the full suite (including the
    # tests and build jobs that no longer run on PRs) re-runs even on
    # days with no merge, so nothing removed from PRs can vanish.
    - cron: '37 5 * * *'
  workflow_dispatch:

# Every trigger is scheduled or manual, so each run is keyed by its
# unique run_id: each nightly or dispatched run keeps its own run
# instead of sharing one group that a newer run would cancel.
concurrency:
  group: pr-checks-${{ github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Four independent jobs on their own Blacksmith runners (same image as
# ubuntu-24.04, faster CPUs, colocated cache; the Blacksmith GitHub App is
# installed on the openchamber org). None of them reads another's output: the
# tests and type-check need only what `bun install` prepares (postinstall
# builds the SDK and the built-in extensions), so the wall time is the slowest
# job, not the sum.
jobs:
  type-check:
    name: "basic: type-check"
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run type-check

  lint:
    name: "basic: lint"
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Changelog outputs match their sources
        run: bun run changelog:check

  # Runs on the nightly schedule and on manual dispatch -- the
  # workflow's only triggers.
  tests:
    name: "full (main tier): tests"
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test
      - name: Electron Linux packaging unit tests
        working-directory: packages/electron
        run: |
          bun run test:architecture
          bun run test:updater
          bun run test:linux-desktop

  # Runs on the nightly schedule and on manual dispatch -- the
  # workflow's only triggers.
  # Catches what type-check cannot: bundling, Vite-only syntax, the web
  # build's memory ceiling. The packages whose `build` is only a type-check (`tsc -b`)
  # (ui) or a no-op (electron) are covered by the type-check job.
  build:
    name: "full (main tier): build"
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build web
        run: bun run --cwd packages/web build
      - name: Build VS Code extension
        run: bun run --cwd packages/vscode build
      - name: Prepare mobile web assets
        run: bun run --cwd packages/mobile build:assets

  # Evaluates this repo's own flake outputs without building them
  # (#1566): PR #1386 broke every flake output by adding an input the
  # outputs formals did not accept, and no workflow here noticed - the
  # upstream nix-eval.yml job is gated to openchamber/openchamber and
  # evaluates outputs this flake does not have. The drvPath evals
  # force the full outputs evaluation for one system; `nix flake show`
  # walks the whole output tree. Red/green proof at implementation:
  # both commands fail on the pre-#1389 flake shape (commit c9c959f193,
  # outputs formals without '...') and pass on current main.
  flake-eval:
    name: "full (main tier): flake eval"
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Evaluate this flake's own outputs (no builds)
        run: |
          nix flake show
          nix eval --raw .#packages.x86_64-linux.openchamber.drvPath
          nix eval --raw .#packages.x86_64-linux.openchamber-desktop.drvPath
          nix eval --raw .#packages.x86_64-linux.default.drvPath
          nix eval --raw .#devShells.x86_64-linux.default.drvPath
          nix eval --raw .#devShells.x86_64-linux.fleet.drvPath
      # The start-wrapper guard check (#2056) pins the generated wrapper
      # bytes for the code#2562 single-instance guard defect. It is a
      # check, not a package, so the drvPath evals above never reach
      # it, and the upstream nix-eval.yml that would run flake checks
      # is gated to openchamber/openchamber. Build it here — this job
      # is Linux-only (ubuntu-24.04) and the check is Linux-only.
      - name: Build the start-wrapper guard check (#2056)
        run: nix build .#checks.x86_64-linux.start-wrapper-guard

  # On failure of any main job above, hand the failure to the central
  # pm-dispatch ci-fix task (developing-today/code#2672). The wrapper is
  # best-effort only: continue-on-error keeps a dispatch problem from
  # masking the real CI result.
  ci-fix:
    needs: [type-check, lint, tests, build, flake-eval]
    if: failure()
    permissions:
      id-token: write
      issues: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pm-dispatch-ci-fix
        continue-on-error: true
        env:
          GH_TOKEN: "${{ github.token }}"
