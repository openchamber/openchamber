name: pr checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild better-sqlite3 native binding for Node
        working-directory: packages/web
        run: |
          set -euo pipefail
          package_json="$(node -e "process.stdout.write(require.resolve('better-sqlite3/package.json'))")"
          native_package="$(dirname "$package_json")"
          npm rebuild --prefix "$native_package" --foreground-scripts
          node -e "const Database = require('better-sqlite3'); const db = new Database(':memory:'); db.prepare('SELECT 1').get(); db.close(); console.log('OK: better-sqlite3 native binding loaded under Node');"

      - name: Build
        run: bun run build

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Lint runtime JavaScript
        # `bun run lint` (root) fans out to each package's `lint` script,
        # which only covers `src/**/*.{ts,tsx}`. The web package's
        # guardian/opencode-lifecycle/CLI bin JavaScript is plain JS
        # outside that glob, so lint:runtime is gated separately to keep
        # server and bin JS under the same ESLint contract on every PR.
        working-directory: packages/web
        run: bun run lint:runtime

      - name: Tests
        run: bun run test

      - name: Session status reconciliation tests
        # UI session-status/freshness regression tests. Run from
        # packages/ui because bun test resolves paths relative to the
        # package root. Keeps the scope focused on session-status
        # snapshot/global status/tray sync, not the full UI test suite.
        working-directory: packages/ui
        run: |
          bun test src/sync/__tests__/session-status-snapshot.test.ts
          bun test src/sync/global-session-status.test.ts
          bun test src/hooks/useTraySync.test.ts
          bun test src/components/session/__tests__/session-status-presentation.test.tsx

      - name: Electron Linux packaging unit tests
        working-directory: packages/electron
        run: |
          bun run test:architecture
          bun run test:updater
          bun run type-check
