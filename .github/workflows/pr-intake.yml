name: pr-intake

# Puts a size label on every pull request and runs the checks in
# .github/scripts/pr-checks.cjs:
# - the contribution gate: a PR from outside the team with no linked bug report
#   or accepted feature request is closed with `needs-accepted-issue`, and
#   reopens when it qualifies, either because its description now links such an
#   issue or because the linked issue was marked `accepted` or `bug`;
# - visual evidence: `evidence-in-branch` while the branch adds screenshots or
#   logs, `needs-visual-evidence` while a UI change has no screenshot in its
#   description. Both come off on their own once fixed.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  issue_comment:
    types: [created]
  issues:
    types: [labeled, unlabeled]
  push:
    branches:
      - main
    paths:
      - .github/workflows/pr-intake.yml

permissions:
  contents: read

jobs:
  collect:
    name: Collect pull requests
    if: ${{ github.repository == 'openchamber/openchamber' }}
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.collect.outputs.targets }}
    steps:
      - id: collect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName === "pull_request_target") {
              const pr = context.payload.pull_request;
              core.setOutput("targets", JSON.stringify([{ number: pr.number, user: pr.user.login }]));
              return;
            }

            if (context.eventName === "issue_comment") {
              const issue = context.payload.issue;
              const body = context.payload.comment?.body ?? "";
              if (!issue?.pull_request || !body.startsWith("/recheck-intake")) {
                core.setOutput("targets", "[]");
                return;
              }
              core.setOutput("targets", JSON.stringify([{ number: issue.number, user: issue.user.login }]));
              return;
            }

            if (context.eventName === "issues") {
              // The issue gained or lost what lets a PR through: recheck every PR
              // that mentions it. Gated ones reopen if they now qualify; open ones
              // whose bug report became a feature request close.
              if (!["accepted", "bug"].includes(context.payload.label?.name)) {
                core.setOutput("targets", "[]");
                return;
              }
              const { repository } = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $number) {
                      timelineItems(itemTypes: [CROSS_REFERENCED_EVENT, CONNECTED_EVENT], last: 100) {
                        nodes {
                          ... on CrossReferencedEvent { source { ... on PullRequest { number state author { login } repository { nameWithOwner } } } }
                          ... on ConnectedEvent { subject { ... on PullRequest { number state author { login } repository { nameWithOwner } } } }
                        }
                      }
                    }
                  }
                }`,
                { owner: context.repo.owner, repo: context.repo.repo, number: context.payload.issue.number },
              );
              const pulls = new Map();
              for (const node of repository.issue.timelineItems.nodes) {
                const pull = node.source ?? node.subject;
                if (!pull?.number || pull.state === "MERGED") continue;
                if (pull.repository.nameWithOwner.toLowerCase() !== `${context.repo.owner}/${context.repo.repo}`.toLowerCase()) continue;
                pulls.set(pull.number, { number: pull.number, user: pull.author?.login ?? "" });
              }
              core.setOutput("targets", JSON.stringify([...pulls.values()]));
              return;
            }

            // Push to main touching this workflow: relabel every open PR.
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            core.setOutput(
              "targets",
              JSON.stringify(pulls.map((pull) => ({ number: pull.number, user: pull.user.login }))),
            );

  intake:
    name: Label PR ${{ matrix.target.number }}
    needs: collect
    if: ${{ needs.collect.outputs.targets != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    concurrency:
      group: pr-intake-${{ matrix.target.number }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.collect.outputs.targets) }}
    steps:
      - name: Generate bot app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.OC_REVIEW_APP_ID }}
          private-key: ${{ secrets.OC_REVIEW_APP_PRIVATE_KEY }}

      # pull_request_target runs with base-repo secrets. The PR head is fetched
      # as passive git data only: no install, no build, no test, no cache.
      - name: Checkout base repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Sync labels and PR checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ matrix.target.number }}
          # A push to main touching this workflow relabels every open PR and
          # posts nothing.
          POST_COMMENTS: ${{ github.event_name != 'push' }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { execFileSync } = require("node:child_process");
            const {
              COMMITTED_MEDIA,
              GATE_LABEL,
              GATE_MARKER,
              MISSING_SCREENSHOTS,
              TEAM_LABEL,
              evaluateContributionGate,
              evaluateVisualEvidence,
              hasMarkerComment,
              isMaintainer,
              listPullFiles,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-checks.cjs`);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = Number(process.env.PR_NUMBER);

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });

            const sizeLabels = [
              { name: "size:XS", color: "0e8a16", description: "Under 10 changed lines (tests, lockfiles and translations excluded)." },
              { name: "size:S", color: "5ebd3e", description: "10-29 changed lines (tests, lockfiles and translations excluded)." },
              { name: "size:M", color: "fbca04", description: "30-99 changed lines (tests, lockfiles and translations excluded)." },
              { name: "size:L", color: "fe7d37", description: "100-499 changed lines (tests, lockfiles and translations excluded)." },
              { name: "size:XL", color: "d93f0b", description: "500-999 changed lines (tests, lockfiles and translations excluded)." },
              { name: "size:XXL", color: "b60205", description: "1,000+ changed lines (tests, lockfiles and translations excluded)." },
            ];
            // Replaced by the contribution gate; taken off every PR that still has it.
            const retiredLabels = ["needs-discussion"];

            const ensureLabel = async (label) => {
              try {
                const { data: existing } = await github.rest.issues.getLabel({ owner, repo, name: label.name });
                if (existing.color !== label.color || (existing.description ?? "") !== label.description) {
                  await github.rest.issues.updateLabel({ owner, repo, name: label.name, color: label.color, description: label.description });
                }
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({ owner, repo, name: label.name, color: label.color, description: label.description });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                }
              }
            };
            for (const label of [...sizeLabels, GATE_LABEL, COMMITTED_MEDIA.label, MISSING_SCREENSHOTS.label, TEAM_LABEL]) {
              await ensureLabel(label);
            }

            // Size label. Lines that don't cost review time are excluded.
            const excludePathspecs = [
              ":(glob,exclude)**/__tests__/**",
              ":(glob,exclude)**/test/**",
              ":(glob,exclude)**/tests/**",
              ":(glob,exclude)**/*.test.*",
              ":(glob,exclude)**/*.spec.*",
              ":(glob,exclude)**/*.snap",
              ":(glob,exclude)**/bun.lock",
              ":(glob,exclude)**/package-lock.json",
              ":(glob,exclude)**/pnpm-lock.yaml",
              ":(glob,exclude)packages/ui/src/lib/i18n/messages/**",
            ];
            const sumNumstat = (text) =>
              text
                .split("\n")
                .filter(Boolean)
                .reduce((total, line) => {
                  const [added = "0", deleted = "0"] = line.split("\t");
                  const a = added === "-" ? 0 : Number.parseInt(added, 10) || 0;
                  const d = deleted === "-" ? 0 : Number.parseInt(deleted, 10) || 0;
                  return total + a + d;
                }, 0);

            const headRef = `refs/remotes/pr-intake/${number}`;
            execFileSync("git", ["fetch", "--no-tags", "origin", pr.base.sha], { stdio: "inherit" });
            execFileSync("git", ["fetch", "--no-tags", "origin", `+refs/pull/${number}/head:${headRef}`], { stdio: "inherit" });
            const headSha = execFileSync("git", ["rev-parse", headRef], { encoding: "utf8" }).trim();

            const diffArgs = ["diff", "--numstat", "--ignore-all-space", "--ignore-blank-lines", `${pr.base.sha}...${headSha}`];
            const totalLines = sumNumstat(execFileSync("git", diffArgs, { encoding: "utf8" }));
            const countedLines = sumNumstat(execFileSync("git", [...diffArgs, "--", ".", ...excludePathspecs], { encoding: "utf8" }));
            // A PR that only touches excluded paths is still sized, by what it touches.
            const effectiveLines = countedLines === 0 ? totalLines : countedLines;
            const sizeLabel =
              effectiveLines < 10 ? "size:XS"
              : effectiveLines < 30 ? "size:S"
              : effectiveLines < 100 ? "size:M"
              : effectiveLines < 500 ? "size:L"
              : effectiveLines < 1000 ? "size:XL"
              : "size:XXL";

            const currentLabelNames = pr.labels.map((label) => label.name);
            const managed = new Set([...sizeLabels.map((label) => label.name), ...retiredLabels]);
            for (const name of currentLabelNames) {
              if (!managed.has(name) || name === sizeLabel) continue;
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            if (!currentLabelNames.includes(sizeLabel)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [sizeLabel] });
            }

            // A failed read must not stop the checks below; the stale workflow
            // labels what this misses before it closes anything.
            if (!currentLabelNames.includes(TEAM_LABEL.name)) {
              try {
                if (await isMaintainer({ github, owner, repo, username: pr.user.login })) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [TEAM_LABEL.name] });
                }
              } catch (error) {
                core.warning(`Could not set the ${TEAM_LABEL.name} label on PR #${number}: ${error.message}`);
              }
            }

            let comments;
            const listComments = async () => {
              comments ??= await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
              return comments;
            };
            const comment = (body) => github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            const removeLabel = (name) => github.rest.issues.removeLabel({ owner, repo, issue_number: number, name }).catch((error) => {
              if (error.status !== 404) throw error;
            });
            // A check that passes again retires its comment's marker, so the PR is
            // not read as waived and the check applies again if it fails later.
            const retireMarker = async (marker) => {
              for (const item of await listComments()) {
                if (!hasMarkerComment([item], marker)) continue;
                await github.rest.issues.updateComment({ owner, repo, comment_id: item.id, body: item.body.replaceAll(marker, marker.replace(" -->", "-lifted -->")) });
              }
            };

            const files = await listPullFiles({ github, owner, repo, pr });

            // The contribution gate (pr-checks.cjs).
            const gate = await evaluateContributionGate({ github, owner, repo, pr, files, workspace: process.env.GITHUB_WORKSPACE });
            const gated = currentLabelNames.includes(GATE_LABEL.name);
            const blocked = !gate.exempt && !gate.passes;
            const gateWaived = blocked && !gated && hasMarkerComment(await listComments(), GATE_MARKER);

            if (blocked && gated) {
              // Reopened by its author without a qualifying issue.
              if (pr.state === "open") await github.rest.pulls.update({ owner, repo, pull_number: number, state: "closed" });
            } else if (blocked && !gateWaived && pr.state === "open" && process.env.POST_COMMENTS === "true") {
              const unaccepted = gate.issues.map((issue) => `#${issue.number}`);
              const reason = unaccepted.length > 0
                ? [`Closing this automatically: ${unaccepted.join(", ")} ${unaccepted.length === 1 ? "is a feature request that isn't" : "are feature requests that aren't"} accepted yet, and a feature gets built after it is. If the maintainer marks it \`accepted\`, this PR reopens on its own.`]
                : [
                    "Closing this automatically: a PR here needs a linked issue.",
                    "",
                    "- Bug fix: open a [bug report](https://github.com/openchamber/openchamber/issues/new?template=bug_report.yml) and put `Fixes #N` in this PR's description.",
                    "- New feature or behavior change: open a [feature request](https://github.com/openchamber/openchamber/issues/new?template=feature_request.yml) and wait until the maintainer marks it `accepted`.",
                    "",
                    "Once the description links a bug report or an accepted feature request, this PR reopens on its own.",
                  ];
              await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [GATE_LABEL.name] });
              await comment([GATE_MARKER, ...reason].join("\n"));
              await github.rest.pulls.update({ owner, repo, pull_number: number, state: "closed" });
            } else if (!blocked) {
              if (gated && pr.state === "closed") {
                try {
                  await github.rest.pulls.update({ owner, repo, pull_number: number, state: "open" });
                } catch (error) {
                  // GitHub refuses to reopen a PR whose head branch is gone.
                  if (error.status !== 422) throw error;
                  await comment("This PR qualifies now, but GitHub can't reopen it because its branch was deleted. Push the branch again and open a new PR with the same description.");
                }
              }
              if (gated) await removeLabel(GATE_LABEL.name);
              await retireMarker(GATE_MARKER);
            }

            // Visual evidence (pr-checks.cjs). A PR the gate closed is left alone.
            const closedByGate = blocked && !gateWaived;
            const howToAttach = "Drag screenshots into the PR description editor and GitHub hosts them, or run `node scripts/pr-evidence.mjs --title \"openchamber #" + number + " evidence\" <files>`, which uploads images to a secret gist and prints the Markdown to paste.";
            const evidence = evaluateVisualEvidence({ pr, files });
            const evidenceChecks = [
              {
                check: COMMITTED_MEDIA,
                failing: evidence.committedMedia.length > 0,
                body: () => [
                  "This PR adds evidence files to the repository:",
                  "",
                  ...evidence.committedMedia.slice(0, 10).map((file) => `- \`${file}\``),
                  ...(evidence.committedMedia.length > 10 ? [`- and ${evidence.committedMedia.length - 10} more`] : []),
                  "",
                  "Screenshots, recordings and logs go in the PR description; committed, they ship in every clone of the repo. " + howToAttach + " Review starts once these files are gone from the branch.",
                ],
              },
              {
                check: MISSING_SCREENSHOTS,
                failing: evidence.missingScreenshots,
                body: () => [
                  "This PR changes UI, and its description has no screenshot. Please add before and after screenshots of what changed (a GIF for motion). " + howToAttach,
                  "",
                  "Review starts once the description has them. If the change really shows nothing on screen, say why in the description and the maintainer will lift the label.",
                ],
              },
            ];
            for (const { check, failing, body } of evidenceChecks) {
              const labeled = currentLabelNames.includes(check.label.name);
              if (failing && !closedByGate && !labeled && pr.state === "open" && process.env.POST_COMMENTS === "true" && !hasMarkerComment(await listComments(), check.marker)) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [check.label.name] });
                await comment([check.marker, ...body()].join("\n"));
              } else if (!failing) {
                if (labeled) await removeLabel(check.label.name);
                await retireMarker(check.marker);
              }
            }

            core.info(`PR #${number}: ${effectiveLines} counted lines (${totalLines} total) -> ${sizeLabel}; gate=${gate.exempt ? `exempt (${gate.exempt})` : gate.passes ? "passes" : "fails"}; committed media=${evidence.committedMedia.length}; missing screenshots=${evidence.missingScreenshots}`);
