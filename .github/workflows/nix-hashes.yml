# Keeps the flake's baked dependency hashes in step with the two files that
# decide them: bun.lock (the bun-deps fixed-output derivation) and
# packages/electron/package.json (the pinned OpenCode CLI tag). When either
# moves on main, the flake fails to evaluate until the tag and hashes are
# re-baked; this workflow runs the same `nix run .#update-hashes` a
# contributor would run and opens a PR with the result.
name: nix-hashes

on:
  push:
    branches: [main]
    paths:
      - bun.lock
      - packages/electron/package.json
  workflow_dispatch:

permissions: {}

concurrency:
  group: nix-hashes
  cancel-in-progress: false

jobs:
  rehash:
    runs-on: ubuntu-latest
    steps:
      # No persisted GITHUB_TOKEN: the only push here goes through the app
      # token below, and a token left in git config would win and get a 403.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # A local substituter backed by the Actions cache: the first run builds
      # the fixed-output derivations and pushes them; later runs substitute
      # in minutes instead of re-downloading the world.
      - uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4 # v9
      # The bake runs without any token; it only needs the network.
      - name: Re-bake dependency hashes
        id: bake
        run: |
          nix run .#update-hashes
          if git diff --quiet; then
            echo "hashes already current, nothing to bake"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The bake PR is opened with the review app, not GITHUB_TOKEN: an
      # App-opened PR gets normal CI (the eval check runs on it), and the
      # repo doesn't need the "Allow GitHub Actions to create and approve
      # pull requests" toggle. The token carries only the two permissions
      # the bake needs, and exists only for the push and the PR.
      - name: Mint the bake bot token
        if: steps.bake.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.OC_REVIEW_APP_ID }}
          private-key: ${{ secrets.OC_REVIEW_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the bake PR
        if: steps.bake.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh auth setup-git
          git config user.name "openchamber-bake-bot"
          git config user.email "openchamber-bake-bot@users.noreply.github.com"
          git checkout -B nix/hash-bake
          # flake.nix moves too when the OpenCode tag in packages/electron/package.json does.
          git add nix/hashes.json flake.lock flake.nix
          git commit \
            -m "chore(nix): re-bake dependency hashes" \
            -m "Automated re-bake after a change to bun.lock or packages/electron/package.json (${GITHUB_SHA})." \
            -m "Reproduce locally with nix run .#update-hashes."
          git push --force origin nix/hash-bake
          if [ "$(gh pr list --head nix/hash-bake --state open --json number --jq 'length')" = "1" ]; then
            echo "an open PR for nix/hash-bake already exists, the force-push updated it"
            exit 0
          fi
          gh pr create \
            --base main \
            --head nix/hash-bake \
            --title "chore(nix): re-bake dependency hashes" \
            --body "Automated re-bake after a change to bun.lock or packages/electron/package.json (commit ${GITHUB_SHA}). Reproduce locally with nix run .#update-hashes; the script verifies each baked hash with a clean build before exiting, so the diff is the hash lines only."
