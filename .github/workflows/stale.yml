name: stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    if: ${{ github.repository == 'openchamber/openchamber' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate bot app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.OC_REVIEW_APP_ID }}
          private-key: ${{ secrets.OC_REVIEW_APP_PRIVATE_KEY }}

      # actions/stale has no exemption by author, so maintainers' pull requests
      # carry a label it skips. A failed read stops the job before it can close
      # a pull request that lacks the label.
      - name: Label team pull requests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            try {
              await github.rest.issues.createLabel({ owner, repo, name: "team", color: "5319e7", description: "Opened by a maintainer. Never closed as stale." });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const pulls = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });
            for (const pull of pulls) {
              if (pull.labels.some((label) => label.name === "team")) continue;
              let role;
              try {
                ({ data: { role_name: role } } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: pull.user.login }));
              } catch (error) {
                // The author's account no longer exists.
                if (error.status !== 404) throw error;
                continue;
              }
              if (role === "admin" || role === "maintain") {
                await github.rest.issues.addLabels({ owner, repo, issue_number: pull.number, labels: ["team"] });
              }
            }

      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ steps.app-token.outputs.token }}
          days-before-stale: 28
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            any activity in the last 28 days. It will be closed in 7 days if no
            further activity occurs.
          close-issue-message: >
            This issue has been automatically closed because it has been stale for
            7 days with no activity. If this is still relevant, please comment or
            reopen the issue.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has
            not had any activity in the last 28 days. It will be closed in 7 days
            if no further activity occurs.
          close-pr-message: >
            This pull request has been automatically closed because it has been
            stale for 7 days with no activity. If this is still relevant, please
            comment or reopen the pull request.
          exempt-issue-labels: pinned,security,help wanted,accepted,enhancement,waiting:opencode
          exempt-pr-labels: pinned,security,help wanted,team
          remove-stale-when-updated: true
          labels-to-add-when-unstale: ""
          operations-per-run: 100
