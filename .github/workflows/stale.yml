name: stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    if: ${{ github.repository == 'openchamber/openchamber' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate bot app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.OC_REVIEW_APP_ID }}
          private-key: ${{ secrets.OC_REVIEW_APP_PRIVATE_KEY }}

      - name: Checkout PR checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      # actions/stale has no exemption by author, so maintainers' pull requests
      # carry a label it skips. pr-intake sets it when a pull request opens; this
      # catches what it missed, and a failed read stops the job before it can
      # close a pull request that lacks the label.
      - name: Label team pull requests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { TEAM_LABEL, isMaintainer } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-checks.cjs`);
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });
            for (const pull of pulls) {
              if (pull.labels.some((label) => label.name === TEAM_LABEL.name)) continue;
              if (await isMaintainer({ github, owner, repo, username: pull.user.login })) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: pull.number, labels: [TEAM_LABEL.name] });
              }
            }

      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ steps.app-token.outputs.token }}
          days-before-stale: 28
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            any activity in the last 28 days. It will be closed in 7 days if no
            further activity occurs.
          close-issue-message: >
            This issue has been automatically closed because it has been stale for
            7 days with no activity. If this is still relevant, please comment or
            reopen the issue.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has
            not had any activity in the last 28 days. It will be closed in 7 days
            if no further activity occurs.
          close-pr-message: >
            This pull request has been automatically closed because it has been
            stale for 7 days with no activity. If this is still relevant, please
            comment or reopen the pull request.
          exempt-issue-labels: pinned,security,help wanted,accepted,enhancement,waiting:opencode
          exempt-pr-labels: pinned,security,help wanted,team
          remove-stale-when-updated: true
          labels-to-add-when-unstale: ""
          operations-per-run: 100
