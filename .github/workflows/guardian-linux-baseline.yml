name: Guardian Linux Baseline

on:
  push:
    branches:
      - 'fix/issue-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: guardian-linux-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-baseline:
    name: linux-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild better-sqlite3 native binding for Node
        working-directory: packages/web
        run: |
          set -euo pipefail
          package_json="$(node -e "process.stdout.write(require.resolve('better-sqlite3/package.json'))")"
          native_package="$(dirname "$package_json")"
          npm rebuild --prefix "$native_package" --foreground-scripts
          node -e "const Database = require('better-sqlite3'); const db = new Database(':memory:'); db.prepare('SELECT 1').get(); db.close(); console.log('OK: better-sqlite3 native binding loaded under Node');"

      - name: Run real guardian lifecycle smoke test
        run: bash scripts/guardian-smoke-test.sh

      - name: Run web-process-boundary restart (POSIX, real guardian + fixture + GuardianClient)
        run: bash scripts/web-restart-boundary-posix.sh

      - name: Run Node-authoritative process and socket-handle boundaries
        # These checks exercise real Node child-process IPC and net.Socket
        # handle transfer. Bun remains the ordinary unit-test runtime, but it
        # must not claim compatibility with this boundary.
        working-directory: packages/web
        run: |
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) { throw new Error('Node.js >=22 is required for the process-boundary gate'); } console.log('Node ' + process.versions.node + ' is authoritative for this boundary');"
          bun run test:node-boundary

      - name: Run guardian and lifecycle tests
        working-directory: packages/web
        run: >-
          bun run test --
          server/lib/guardian/
          --exclude server/lib/guardian/process-boundary.test.js
          server/lib/opencode/lifecycle-guardian-integration.test.js
          server/lib/opencode/shutdown-runtime.test.js

      - name: Type-check web package
        working-directory: packages/web
        run: bun run type-check

      - name: Lint web package
        working-directory: packages/web
        run: bun run lint
