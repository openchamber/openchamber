name: Feature request
description: Suggest an improvement
title: "[Feature Request] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please write in English. The maintainers skim every request, and one in another language waits until someone translates it. Machine translation is fine.

  - type: checkboxes
    id: language
    attributes:
      label: Language
      options:
        - label: This request is written in English
          required: true

  - type: textarea
    id: request
    attributes:
      label: What should we add/change?
      description: What you're trying to do + what you'd like to happen.
      placeholder: |
        I'm trying to …

        It would be great if OpenChamber …
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Extra context (optional)
      description: Links, screenshots, mockups, constraints, etc.
