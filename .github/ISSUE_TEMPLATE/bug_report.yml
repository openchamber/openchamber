name: Bug report
description: Something is broken, crashes, or behaves differently than before.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This form is for bugs. Feature ideas go to [Ideas discussions](https://github.com/openchamber/openchamber/discussions/categories/ideas), questions to [Q&A discussions](https://github.com/openchamber/openchamber/discussions/categories/q-a).

        Please write in English. The maintainers skim every report, and one in another language waits until someone translates it. Machine translation is fine.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and didn't find this bug
          required: true
        - label: This is one bug. Other problems get their own issue.
          required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, step by step. If it only happens sometimes, say how often.
      placeholder: |
        1. Open a project with ...
        2. Send a message with ...
        3. Switch to another session and back
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: The reply keeps streaming in the first session.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      placeholder: The reply stops and the session shows as idle.
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Where does it happen?
      options:
        - Desktop app (macOS)
        - Desktop app (Windows)
        - Desktop app (Linux)
        - Web in a browser
        - Mobile (web/PWA)
        - Mobile app (iOS/Android)
        - VS Code extension
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: OpenChamber version
      description: Settings > About shows it.
      placeholder: "e.g. 1.23.0"
    validations:
      required: true

  - type: input
    id: opencode
    attributes:
      label: OpenCode version and model/provider (if relevant)
      placeholder: "e.g. 2.0.3, zen / claude-sonnet-5"

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / recordings (optional)
      description: "Anything visual that helps."

  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: "Paste relevant logs. Remove tokens, keys and anything personal."
      render: shell
