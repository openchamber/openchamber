appId: com.openchamber.app
androidWebViewHierarchy: devtools
---
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: "Open menu"
    commands:
      - tapOn: "Open menu"
      - tapOn: "Workspaces"
- runFlow:
    when:
      visible: "Delete workspace"
    commands:
      - tapOn: "Delete workspace"
      - assertVisible: "Remove secure workspace?"
      - tapOn: "Delete workspace"
      - extendedWaitUntil:
          visible: "No workspaces found for this project."
          timeout: 120000
- assertVisible: "No workspaces found for this project."
