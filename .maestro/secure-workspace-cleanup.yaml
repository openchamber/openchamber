# Operator-run fixture, not CI — see secure-workspace-physical.yaml and
# docs/SECURE_WORKSPACES.md. Run after the physical flow to
# leave the disposable device and remote server without workspace state.
appId: com.openchamber.app
androidWebViewHierarchy: devtools
---
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: "Open menu"
    commands:
      - tapOn: "Open menu"
      - tapOn: "Workspaces"
- runFlow:
    when:
      visible: "Delete workspace"
    commands:
      - tapOn: "Delete workspace"
      - assertVisible: "Remove secure workspace?"
      - tapOn: "Delete workspace"
      - extendedWaitUntil:
          visible: "No workspaces found for this project."
          timeout: 120000
- assertVisible: "No workspaces found for this project."
